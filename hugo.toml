baseURL = 'https://go-dsp.github.io/'
locale  = 'en-us'
title   = 'go-dsp'
# No theme -- the layout is the go-* family template, taken from the Hugo module
# github.com/go-fleettools/landingkit (partials styles.html, theme-toggle.html,
# fork-ribbon.html and the icons), pinned in go.mod. layouts/index.html is this
# organisation's own page.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-dsp: digital signal processing in pure Go (CGO=0). Filter design and filtering, spectral estimation and resampling, with the semantics of SciPy's scipy.signal, tested against recorded SciPy answers."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "signal"
  kind  = "released v0.1.0"
  href  = "https://github.com/go-dsp/signal"
  blurb = "Filter design (Butterworth, Chebyshev, elliptic, Bessel, window method, Parks–McClellan, least squares), windows, filtering and zero-phase filtering, convolution, Welch, STFT and Lomb–Scargle estimation, resampling and peak finding, with the semantics of <code>scipy.signal</code>."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-dsp.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the library's own README, verification, accuracy and performance documents. <a href=\"https://github.com/go-dsp/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-dsp/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the README of the library it names, at v0.1.0.
[[params.checks]]
  name = "SciPy 1.18.1 as the oracle"
  what = "Every comparison is recorded from SciPy 1.18.1 with NumPy 2.5.4 and replayed from `testdata/oracle`, so `go test` needs no Python and the same recorded output is checked on every architecture CI runs. (signal)"
[[params.checks]]
  name = "Errors in ULPs, 225 groups"
  what = "`docs/accuracy.md` lists the maximum ULP error, the normwise relative error and the exact-equality count for 225 groups of values, and `docs/verification.md` names the few places where SciPy itself is the less accurate side. (signal)"
[[params.checks]]
  name = "Covered, raced and fuzzed"
  what = "100% statement coverage with `-race`, error paths included; fuzz targets for the design constructors, the spectral estimators, the convolutions and the peak finder; `gofmt`, `go vet` and `govulncheck`. (signal)"
[[params.checks]]
  name = "Architectures"
  what = "Tests on amd64, arm64 and 386, under qemu on riscv64, loong64, ppc64le, s390x and arm, and every `GOOS/GOARCH` pair compiling the tests. (signal)"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.30:1, bright on the dark background 8.25:1.
  base = "#b3245f"
  deep = "#6d163a"
  bright = "#f08ab0"
  shadow = "rgba(179,36,95,.7)"
  glow = "rgba(179,36,95,.6)"
  wash = "rgba(179,36,95,.10)"
  washDeep = "rgba(109,22,58,.06)"
  chipBg = "#fdf1f6"
  chipBorder = "#fadce7"
  chipFg = "#6d163a"
  chipBgDark = "rgba(240,138,176,.14)"
  chipBorderDark = "rgba(240,138,176,.32)"
  chipFgDark = "#f7bfd4"
  statsEnd = "#fbe3ec"
  bandText = "#fdecf2"
