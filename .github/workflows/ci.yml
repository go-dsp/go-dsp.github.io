name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: the site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true
      - run: hugo --minify
        env:
          GOWORK: "off"
      # A page that builds and says nothing is a page nobody notices is empty.
      - name: every repository is on it
        run: |
          for repo in signal docs brand; do
            grep -q "go-dsp/$repo" public/index.html \
              || { echo "::error::$repo is not on the page"; exit 1; }
          done
          echo "the page names every repository this org has"

  # go.mod requires the landingkit module and kit.go keeps `go mod tidy` from
  # dropping the requirement (a Hugo site has no Go code that imports it).
  kit:
    name: the kit requirement survives go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
        env:
          GOWORK: "off"
      - name: go.mod and go.sum are tidy and still require landingkit
        run: |
          git diff --exit-code -- go.mod go.sum
          grep -q 'github.com/go-fleettools/landingkit' go.mod
